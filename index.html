<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Müziklerim</title>
<meta name="theme-color" content="#14161f">
<meta name="description" content="Reklamsız, internetsiz müzik çalar">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Müziklerim">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Müziklerim</h1>
  <span id="count" class="count"></span>
</header>

<main>
  <button id="addBtn" class="add-btn">
    <span class="plus">+</span> Şarkı Ekle
  </button>
  <input id="fileInput" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac,.wma,.amr" multiple hidden>

  <div id="searchWrap" class="search-wrap" hidden>
    <input id="search" type="search" placeholder="🔍  Şarkı ara..." autocomplete="off">
  </div>

  <div id="empty" class="empty" hidden>
    <div class="empty-icon">🎵</div>
    <p><b>Henüz şarkı yok.</b></p>
    <p>Yukarıdaki <b>“Şarkı Ekle”</b> düğmesine basın ve telefonunuzdaki şarkıları seçin.</p>
    <p>Eklenen şarkılar uygulamanın içine kaydedilir, <b>internet olmadan</b> da çalar.</p>
  </div>

  <ul id="list" class="list"></ul>
  <p id="storage" class="storage"></p>
</main>

<footer id="player" class="player" hidden>
  <div class="now">
    <div id="nowTitle" class="now-title">—</div>
  </div>
  <div class="progress-row">
    <span id="cur" class="time">0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Şarkı konumu">
    <span id="dur" class="time">0:00</span>
  </div>
  <div class="controls">
    <button id="shuffleBtn" class="ctl small" aria-label="Karışık çal" title="Karışık çal">
      <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
      <span class="ctl-label">Karışık</span>
    </button>
    <button id="prevBtn" class="ctl" aria-label="Önceki şarkı">
      <svg viewBox="0 0 24 24" class="fill"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <button id="playBtn" class="ctl play" aria-label="Çal">
      <svg id="icoPlay" viewBox="0 0 24 24" class="fill"><path d="M7 4v16l13-8z"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" class="fill" hidden><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <button id="nextBtn" class="ctl" aria-label="Sonraki şarkı">
      <svg viewBox="0 0 24 24" class="fill"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
    </button>
    <button id="repeatBtn" class="ctl small" aria-label="Tekrar" title="Tekrar">
      <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
      <span id="repeatLabel" class="ctl-label">Tekrar</span>
    </button>
  </div>
</footer>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-box">
    <div id="sheetTitle" class="sheet-title"></div>
    <button id="renameBtn" class="sheet-btn">✏️  Adını değiştir</button>
    <button id="deleteBtn" class="sheet-btn danger">🗑️  Sil</button>
    <button id="cancelBtn" class="sheet-btn cancel">Vazgeç</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
