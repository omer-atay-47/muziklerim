<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Müziklerim</title>
<meta name="description" content="Reklamsız, internetsiz müzik ve klip çalar. Telefonundaki şarkıları ve klipleri ekle, dinle, izle.">
<meta name="theme-color" content="#0b0b0e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Müziklerim">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="view" class="view"></main>

<div id="importBar" class="import-bar" hidden></div>
<div id="mini" class="mini" hidden></div>

<section id="np" class="np" hidden aria-label="Şimdi çalıyor"></section>
<div id="mediaHost" class="media-host" aria-hidden="true"></div>
<div id="layer" class="layer" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="drop" class="drop" hidden><div>Şarkıları buraya bırakın</div></div>

<input id="fileInput" type="file" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac,.wma,.amr,.mp4,.m4v,.mov,.webm,.mkv,.3gp" multiple hidden>
<input id="folderInput" type="file" webkitdirectory multiple hidden>

<noscript>Bu uygulama için JavaScript gerekli.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
